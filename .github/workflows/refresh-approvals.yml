# Rebuild the approval index on demand, and redeploy when a review in dita-corpus changed it.
name: refresh-approvals
on:
  # Manual only while deploys go through scripts/deploy.sh.
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  compare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with: {submodules: true, fetch-depth: 0}
      - run: git -C corpus fetch -q origin main && git -C corpus checkout -q origin/main
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q lxml pyyaml
      - id: c
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          python scripts/approval_index.py --out now.json
          h=$(curl -s https://aegis-api-335536436651.us-central1.run.app/api/health)
          live="$(jq -r '.approvals.approved_files // -1' <<<"$h") $(jq -r '.corpus.commit // ""' <<<"$h")"
          now="$(jq '[.files[] | select(.approvers|length>0)] | length' now.json) $(git -C corpus rev-parse --short=12 HEAD)"
          echo "::notice title=Approved files and corpus::live $live, now $now"
          echo "changed=$([ "$live" != "$now" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: compare
    if: needs.compare.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-api.yml
    secrets: inherit
