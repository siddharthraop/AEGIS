# Build the approval index and the DITA-OT packs, build the image, prove it works, push it, deploy it, check it live.
name: deploy-api
on:
  push:
    branches: [main]
    paths: ["aegis/**", "api/**", "packs/**", "scripts/**", "corpus", "Dockerfile", "pyproject.toml", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: deploy-api
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write   # Workload Identity Federation to Google Cloud
env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE: aegis-api
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {submodules: true, fetch-depth: 0}
      - name: Corpus at dita-corpus main (the manifest records the commit)
        run: git -C corpus fetch -q origin main && git -C corpus checkout -q FETCH_HEAD && git -C corpus log -1 --format='%h %s'
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - id: dita-cache
        uses: actions/cache@v4
        with: {path: ~/dita-ot-4.4, key: dita-ot-4.4}
      - if: steps.dita-cache.outputs.cache-hit != 'true'
        run: curl -sSL -o /tmp/dita.zip https://github.com/dita-ot/dita-ot/releases/download/4.4/dita-ot-4.4.zip && unzip -q /tmp/dita.zip -d ~
      - run: pip install -q -e '.[api,test]'
      - name: Approval index (Git history and pull request reviews)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          python scripts/approval_index.py
          echo "::notice title=Approval index::$(python -c "import json;d=json.load(open('data/approvals.json'));print(sum(1 for f in d['files'].values() if f['approvers']), 'of', len(d['files']), 'files approved through a reviewed PR')")"
      - name: DITA-OT packs (strict)
        run: ./scripts/build_packs.sh
        env: {DITA_HOME: /home/runner/dita-ot-4.4}
      - name: Tests, including DITA-OT parity
        run: AEGIS_APPROVALS=tests/fixtures/approvals.json python -m pytest -q
      - name: Build
        run: docker build --build-arg CORPUS_COMMIT="$(git -C corpus rev-parse --short=12 HEAD)" -t aegis-api:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8080:8080 aegis-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health >/dev/null && break; sleep 1; done
          curl -s localhost:8080/api/health | jq -c '{corpus, approvals}'
          for r in authority downstream public; do
            curl -sf "localhost:8080/api/run?reader=$r&sid=ci-smoke-000000000001" | jq -c --arg r "$r" '{reader:$r, status, summary}'
          done
          curl -sf -o pack.zip "localhost:8080/api/pack?reader=authority&sid=ci-smoke-000000000001"
          unzip -l pack.zip | tail -n +4 | head -20
          echo "Image size: $(docker image inspect aegis-api:ci --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1e6}')"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Push
        id: push
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/tw-images/aegis-api:${GITHUB_SHA::12}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker tag aegis-api:ci "$IMAGE" && docker push -q "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Deploy (0 to 1 instance, request-based billing)
        run: |
          gcloud run deploy "$SERVICE" --project="${{ vars.GCP_PROJECT }}" --region="$REGION" \
            --image="${{ steps.push.outputs.image }}" \
            --service-account="${{ vars.GCP_RUNTIME_SA }}" \
            --min-instances=0 --max-instances=1 --cpu-throttling --concurrency=8 --timeout=120 \
            --cpu=1 --memory=512Mi --port=8080 \
            --set-secrets="GOOGLE_API_KEY=gemini-api-key:latest" \
            --set-env-vars="AEGIS_MODEL=gemini-3.8-flash,AEGIS_FIRESTORE=1,GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT }}" \
            --labels="project=aegis,managed-by=deploy-api" --quiet
      - name: Sandbox TTL (Firestore deletes a sandbox 7 days after its last change)
        continue-on-error: true
        run: |
          gcloud firestore fields ttls update expires_at --collection-group=aegis_sandbox --enable-ttl \
            --project="${{ vars.GCP_PROJECT }}" --async --quiet \
          || echo "::warning title=Firestore TTL not set::The deploy account can't set the TTL policy. Run once: gcloud firestore fields ttls update expires_at --collection-group=aegis_sandbox --enable-ttl --project=${{ vars.GCP_PROJECT }}. The API ignores expired sandboxes either way."
      - name: Check the live API
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project="${{ vars.GCP_PROJECT }}" --region="$REGION" --format='value(status.url)')
          echo "::notice title=Service URL::$URL"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health")
          if [ "$code" = "403" ]; then
            echo "::error title=Not public yet::Run once: gcloud run services add-iam-policy-binding $SERVICE --region=$REGION --member=allUsers --role=roles/run.invoker --project=${{ vars.GCP_PROJECT }}"
            exit 0
          fi
          echo "::notice title=Health::$(curl -s "$URL/api/health" | jq -c '{model, store, approvals}')"
          echo "::notice title=Authority::$(curl -s "$URL/api/run?reader=authority&sid=ci-live-0000000000001" -H 'Origin: https://siddharthraop.github.io' | jq -c '{status, summary}')"
          q='Is the training compute for Gemma 4 documented anywhere?'
          echo "::notice title=Ask::$(curl -s -m 110 -X POST "$URL/api/ask" -H 'Content-Type: application/json' -d "$(jq -n --arg q "$q" '{question:$q}')" | jq -c '{model: .model.name, err: .model.error, points: (.points|length), dropped: (.dropped|length), sources: [.sources[].id], ms}')"
